<head>
<meta charset="utf-8">

<title>బండవుతాపురం కూరగాయలు & సరుకులు</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7FAF5;--sf:#fff;--tx:#1b2a1f;--mu:#5d6b61;--pr:#287A45;--pt:#fff;--ac:#E4F2E5;--bd:#d5e2d6;--wr:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a13;--sf:#18251c;--tx:#e6f0e8;--mu:#9bb0a0;--pr:#5fbf7f;--pt:#0c1a11;--ac:#1f3326;--bd:#2c4033;--wr:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a13;--sf:#18251c;--tx:#e6f0e8;--mu:#9bb0a0;--pr:#5fbf7f;--pt:#0c1a11;--ac:#1f3326;--bd:#2c4033;--wr:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 "Noto Sans Telugu",system-ui,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pr);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pr);color:var(--pt);padding:12px 16px;z-index:9;font-weight:700;font-size:17px;line-height:1.35}
main{max-width:640px;margin:0 auto;padding:14px}
h2{font-size:18px;margin:18px 0 8px}
.hero{background:var(--ac);border-radius:18px;padding:16px}
.hero b{font-size:20px;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{flex:none;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:20px;padding:6px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0 10px}
label{font-size:14px;color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mu{color:var(--mu);font-size:14px}
.badge{display:inline-block;background:var(--ac);color:var(--pr);border-radius:8px;padding:0 8px;font-size:13px;font-weight:600}
button.b{background:var(--pr);color:var(--pt);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.b.o{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button.b:disabled{opacity:.45}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--pr);background:var(--sf);color:var(--pr);font-size:20px;cursor:pointer}
.ph{width:64px;height:64px;flex:none;border-radius:12px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}
.err{color:var(--wr);font-weight:600;min-height:22px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:13px;padding:10px 4px;cursor:pointer}
nav button.on{color:var(--pr);font-weight:700}
nav span{display:block;font-size:20px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
</style>
</head>

var CATS=[["veg","కూరగాయలు"],["fruit","పండ్లు"],["leafy","ఆకుకూరలు"],["grocery","కిరాణా సరుకులు"],["grains","పప్పులు & ధాన్యాలు"],["dairy","పాలు & పాల ఉత్పత్తులు"]];
var ICON={veg:"🍅",fruit:"🍌",leafy:"🌿",grocery:"🛒",grains:"🌾",dairy:"🥛"};
var STAT=["కొత్త ఆర్డర్","అంగీకరించారు","డెలివరీ అయింది"];
var sb=null,me=null,prof=null,P=[],O=[],PINS="",cart={},tab="shop",cat="all",q="",mode="login",msg="",busy=false;
try{cart=JSON.parse(localStorage.getItem("bnd_cart")||"{}")}catch(e){}
function saveCart(){try{localStorage.setItem("bnd_cart",JSON.stringify(cart))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return "₹"+(Math.round(n*100)/100)}
function prod(id){return P.filter(function(p){return p.id==id})[0]}
function catName(id){var c=CATS.filter(function(x){return x[0]==id})[0];return c?c[1]:""}
function isAdmin(){return !!(prof&&prof.is_admin)}
function setMsg(m){msg=m;var e=document.getElementById("er");if(e)e.textContent=m}
function val(i){return document.getElementById(i).value.trim()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function go(t){tab=t;msg="";render()}

async function init(){
  if(SB_URL.indexOf("PASTE")==0){document.getElementById("app").innerHTML='<div class="card">Supabase సెటప్ ఇంకా పూర్తి కాలేదు. SETUP.md లో చెప్పినట్లు URL, KEY ఈ ఫైల్‌లో పెట్టండి.</div>';return}
  sb=supabase.createClient(SB_URL,SB_KEY);
  var r=await sb.auth.getSession();me=r.data.session?r.data.session.user:null;
  await loadAll();render();
  setInterval(async function(){if(tab=="orders"&&isAdmin()){await loadAll();render()}},30000);
}
async function loadAll(){
  var a=await sb.from("products").select("*").order("name");P=a.data||[];
  var s=await sb.from("settings").select("value").eq("key","pins").maybeSingle();PINS=s.data?s.data.value:"";
  if(me){
    var f=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();prof=f.data;
    var o=await sb.from("orders").select("*").order("created_at",{ascending:false}).limit(100);O=o.data||[];
  }
}
function render(){
  var T=[["shop","🛒","షాప్"],["cart","🧺","కార్ట్"],["orders","📦","ఆర్డర్లు"]];
  if(isAdmin())T.push(["seller","🏪","విక్రేత"]);
  T.push(["me","👤",me?"నా ఖాతా":"లాగిన్"]);
  var n=Object.keys(cart).length;
  document.getElementById("nav").innerHTML=T.map(function(t){return '<button class="'+(tab==t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+(t[0]=="cart"&&n?" ("+n+")":"")+'</button>'}).join("");
  document.getElementById("app").innerHTML={shop:shopV,cart:cartV,orders:ordersV,seller:sellerV,me:meV}[tab]();
  if(tab=="shop")list();if(tab=="cart")drawQR();
}

/* ---------- login ---------- */
function authV(){
  var su=mode=="signup";
  return '<h2>'+(su?"కొత్త ఖాతా":"లాగిన్")+'</h2><label>ఫోన్ నంబర్ (10 అంకెలు)</label><input id="lp" inputmode="numeric" maxlength="10" autocomplete="tel">'
  +(su?'<label>పేరు</label><input id="ln" autocomplete="name"><label>చిరునామా</label><input id="la">':'')
  +'<label>పాస్‌వర్డ్ (కనీసం 6 అక్షరాలు)</label><input id="lw" type="password" autocomplete="'+(su?"new-password":"current-password")+'"><div class="err" id="er">'+esc(msg)+'</div>'
  +'<button class="b" style="width:100%" onclick="doAuth()">'+(su?"ఖాతా తెరవండి":"లాగిన్")+'</button>'
  +'<p class="mu" style="text-align:center"><a href="#" onclick="mode=\''+(su?"login":"signup")+'\';msg=\'\';render();return false">'+(su?"ఖాతా ఉందా? లాగిన్ చేయండి":"కొత్తవారా? ఖాతా తెరవండి")+'</a></p>';
}
function em(ph){return ph+"@bandavuthapuram.app"}
async function doAuth(){
  var ph=val("lp"),pw=document.getElementById("lw").value,r;
  if(!/^[6-9]\d{9}$/.test(ph))return setMsg("సరైన 10 అంకెల ఫోన్ నంబర్ ఇవ్వండి.");
  if(pw.length<6)return setMsg("పాస్‌వర్డ్ కనీసం 6 అక్షరాలు ఉండాలి.");
  setMsg("దయచేసి వేచి ఉండండి...");
  if(mode=="signup"){
    var nm=val("ln"),ad=val("la");if(!nm||!ad)return setMsg("పేరు, చిరునామా నమోదు చేయండి.");
    r=await sb.auth.signUp({email:em(ph),password:pw});
    if(r.error)return setMsg(/regist/i.test(r.error.message)?"ఈ నంబర్ ఇప్పటికే నమోదైంది. లాగిన్ చేయండి.":"నమోదు కాలేదు: "+r.error.message);
    if(!r.data.session)return setMsg("Supabase లో Confirm email ఆఫ్ చేయండి (SETUP.md చూడండి).");
    me=r.data.user;
    var ins=await sb.from("profiles").insert({id:me.id,name:nm,phone:ph,address:ad});
    if(ins.error)return setMsg(ins.error.message);
  }else{
    r=await sb.auth.signInWithPassword({email:em(ph),password:pw});
    if(r.error)return setMsg("ఫోన్ నంబర్ లేదా పాస్‌వర్డ్ తప్పు.");
    me=r.data.user;
  }
  msg="";await loadAll();render();
}
async function logout(){await sb.auth.signOut();me=null;prof=null;O=[];tab="shop";render()}
function meV(){
  if(!me||!prof)return authV();
  return '<h2>నా ఖాతా</h2><div class="card"><b>'+esc(prof.name)+'</b><div class="mu">'+esc(prof.phone)+'</div><div class="mu">'+esc(prof.address)+'</div>'+(isAdmin()?'<div class="badge" style="margin-top:6px">విక్రేత (అడ్మిన్)</div>':'')+'</div><button class="b o" onclick="logout()">లాగౌట్</button>';
}

/* ---------- shop ---------- */
function shopV(){
  var h='<div class="hero"><b>మీ స్థానిక మార్కెట్ ఇప్పుడు మీ చేతిలో</b>రైతులు మరియు స్థానిక షాపుల నుంచి తాజా సరుకులు</div>';
  h+='<div class="chips"><button class="chip '+(cat=="all"?"on":"")+'" onclick="cat=\'all\';render()">అన్నీ</button>'+CATS.map(function(c){return '<button class="chip '+(cat==c[0]?"on":"")+'" onclick="cat=\''+c[0]+'\';render()">'+c[1]+'</button>'}).join("")+'</div>';
  return h+'<input id="q" placeholder="వెతకండి" value="'+esc(q)+'" oninput="q=this.value;list()"><div id="list"></div>';
}
function list(){
  var el=document.getElementById("list");if(!el)return;
  var items=P.filter(function(p){return (cat=="all"||p.cat==cat)&&(!q||(p.name+p.shop).toLowerCase().indexOf(q.toLowerCase())>-1)});
  if(!items.length){el.innerHTML='<div class="card mu">వస్తువులు లేవు.</div>';return}
  el.innerHTML=items.map(function(p){
    var n=cart[p.id]||0,im=p.img||SEEDIMG[p.id];
    return '<div class="card"><div class="row"><div style="display:flex;gap:12px;align-items:center"><div class="ph">'+(im?'<img src="'+esc(im)+'" alt="'+esc(p.name)+'">':(ICON[p.cat]||"🛒"))+'</div><div><b>'+esc(p.name)+'</b> '+(p.organic?'<span class="badge">ఆర్గానిక్ ధృవీకరించబడింది</span>':'')+'<div class="mu">'+esc(p.shop)+' · '+catName(p.cat)+'</div><div><b>'+money(p.price)+'</b> / '+esc(p.unit)+'</div><div class="mu">స్టాక్: '+p.stock+' '+esc(p.unit)+' · నవీకరణ: '+new Date(p.updated_at).toLocaleDateString("te-IN")+'</div></div></div>'
      +(p.stock>0?'<button class="b" onclick="add(\''+p.id+'\')">'+(n?'జోడించారు ('+n+')':'కార్ట్‌కి')+'</button>':'<span class="mu">స్టాక్ లేదు</span>')+'</div></div>'}).join("");
}
function add(id){var p=prod(id);cart[id]=Math.min((cart[id]||0)+1,p.stock);saveCart();list();render()}
function chg(id,d){var p=prod(id);var n=(cart[id]||0)+d;if(n<=0)delete cart[id];else cart[id]=Math.min(n,p.stock);saveCart();render()}

/* ---------- cart ---------- */
function cartTotal(){var t=0;for(var k in cart){var p=prod(k);if(p)t+=p.price*cart[k]}return t}
function upiLink(){return "upi://pay?pa="+UPI+"&pn="+encodeURIComponent("Marupatla Radhika")+"&cu=INR"}
function copyUPI(b){try{navigator.clipboard.writeText(UPI).then(function(){b.textContent="కాపీ అయింది"},function(){b.textContent=UPI})}catch(e){b.textContent=UPI}}
function drawQR(){var el=document.getElementById("qr");if(!el)return;el.innerHTML="";try{new QRCode(el,{text:upiLink(),width:190,height:190,correctLevel:QRCode.CorrectLevel.M})}catch(e){}}
function cartV(){
  if(!me||!prof)return '<div class="card">ఆర్డర్ చేయాలంటే ముందు లాగిన్ అవ్వండి.</div>'+authV();
  var ids=Object.keys(cart).filter(function(k){return prod(k)});
  if(!ids.length)return '<h2>కార్ట్</h2><div class="card mu">కార్ట్ ఖాళీగా ఉంది. షాప్ ట్యాబ్‌లో వస్తువులను జోడించండి.</div>';
  var total=cartTotal();
  var h='<h2>కార్ట్</h2>'+ids.map(function(id){var p=prod(id);return '<div class="card row"><div><b>'+esc(p.name)+'</b><div class="mu">'+money(p.price)+' / '+esc(p.unit)+'</div></div><div class="qty"><button aria-label="తగ్గించు" onclick="chg(\''+id+'\',-1)">−</button><b>'+cart[id]+'</b><button aria-label="పెంచు" onclick="chg(\''+id+'\',1)">+</button></div></div>'}).join("");
  h+='<div class="card row"><b>మొత్తం</b><b>'+money(total)+'</b></div>';
  h+='<h2>UPI తో చెల్లించండి</h2><div class="card" style="text-align:center"><div id="qr" style="display:flex;justify-content:center;background:#fff;padding:12px;border-radius:12px;margin-bottom:10px"></div><div>QR స్కాన్ చేసి ఈ మొత్తం టైప్ చేయండి: <b>'+money(total)+'</b></div><a class="b" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="'+upiLink()+'">UPI యాప్ తెరిచి చెల్లించండి</a><button class="b o" style="margin-top:10px;width:100%" onclick="copyUPI(this)">UPI ID కాపీ చేయండి</button><div class="mu" style="margin-top:8px">చెల్లించిన తర్వాత కింద Transaction ID నమోదు చేసి ఆర్డర్ చేయండి.</div></div>';
  h+='<h2>డెలివరీ వివరాలు</h2><label>చిరునామా</label><input id="ca" value="'+esc(prof.address)+'"><label>PIN కోడ్ (6 అంకెలు)</label><input id="cz" inputmode="numeric" maxlength="6"><label>UPI Transaction ID / UTR (12 అంకెలు)</label><input id="cu" inputmode="numeric" maxlength="12"><div class="mu">ఆర్డర్ చేసినప్పుడు మీ ప్రస్తుత లొకేషన్ షాప్‌కు పంపబడుతుంది. ఫోన్ అనుమతి అడిగితే "Allow" నొక్కండి.</div><div class="err" id="er">'+esc(msg)+'</div><button class="b" id="pb" style="width:100%" onclick="place()">ఆర్డర్ చేయండి</button>';
  return h;
}
function getLoc(){return new Promise(function(res){if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude})},function(){res(null)},{enableHighAccuracy:true,timeout:15000})})}
async function place(){
  if(busy)return;
  var ad=val("ca"),pin=val("cz"),ut=val("cu");
  if(!ad)return setMsg("చిరునామా నమోదు చేయండి.");
  if(!/^\d{6}$/.test(pin))return setMsg("సరైన 6 అంకెల PIN కోడ్ ఇవ్వండి.");
  var ok=PINS.split(",").map(function(x){return x.trim()}).filter(Boolean);
  if(ok.length&&ok.indexOf(pin)<0)return setMsg("క్షమించండి, ఈ PIN కోడ్‌కు ప్రస్తుతం డెలివరీ లేదు.");
  if(!/^\d{12}$/.test(ut))return setMsg("UPI లో చెల్లించిన తర్వాత 12 అంకెల Transaction ID (UTR) నమోదు చేయండి.");
  busy=true;setMsg("లొకేషన్ తీసుకుంటున్నాం...");
  var l=await getLoc();
  if(!l){busy=false;return setMsg("లొకేషన్ అనుమతి ఇవ్వండి. ఫోన్ సెట్టింగ్స్‌లో Location ఆన్ చేసి మళ్ళీ ప్రయత్నించండి.")}
  setMsg("ఆర్డర్ పంపుతున్నాం...");
  var items=Object.keys(cart).map(function(k){return {id:k,qty:cart[k]}});
  var r=await sb.rpc("place_order",{p_items:items,p_address:ad,p_pin:pin,p_lat:l.lat,p_lng:l.lng,p_utr:ut});
  busy=false;
  if(r.error)return setMsg(/duplicate/i.test(r.error.message)?"ఈ Transaction ID ఇప్పటికే వాడారు.":r.error.message);
  cart={};saveCart();msg="";await loadAll();tab="orders";render();
}

/* ---------- orders ---------- */
function ordersV(){
  if(!me||!prof)return '<div class="card">మీ ఆర్డర్లు చూడాలంటే లాగిన్ అవ్వండి.</div>'+authV();
  var ad=isAdmin();
  var h='<div class="row"><h2>'+(ad?"అన్ని ఆర్డర్లు":"నా ఆర్డర్లు")+'</h2><button class="b o" onclick="refresh()">రిఫ్రెష్</button></div>';
  if(!O.length)return h+'<div class="card mu">ఇంకా ఆర్డర్లు లేవు.</div>';
  return h+O.map(function(o){
    var its=(o.items||[]).map(function(i){return esc(i.name)+' ×'+i.qty+' '+esc(i.unit)}).join(", ");
    return '<div class="card"><div class="row"><b>ఆర్డర్ #'+esc(o.code)+'</b><b>'+money(o.total)+'</b></div><div class="mu">'+new Date(o.created_at).toLocaleString("te-IN")+'</div>'
      +(ad?'<div><b>'+esc(o.name)+'</b> · <a href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a></div>':'')
      +'<div class="mu">'+esc(o.address)+' - '+esc(o.pin)+'</div>'
      +(ad&&o.lat!=null?'<div><a target="_blank" rel="noopener" href="https://www.google.com/maps?q='+o.lat+','+o.lng+'">📍 లొకేషన్ మ్యాప్‌లో చూడండి</a></div>':'')
      +'<div style="margin-top:6px">'+its+'</div>'+(ad?'<div class="mu">UTR: '+esc(o.utr)+'</div>':'')
      +'<div class="row" style="margin-top:8px"><span class="badge">'+STAT[o.status]+'</span>'+(ad&&o.status<2?'<button class="b o" onclick="adv('+o.id+','+o.status+')">'+(o.status==0?"అంగీకరించు":"డెలివరీ అయింది")+'</button>':'')+'</div></div>'}).join("");
}
async function refresh(){await loadAll();render()}
async function adv(id,s){var r=await sb.from("orders").update({status:s+1}).eq("id",id);if(r.error)alert(r.error.message);await loadAll();render()}

/* ---------- seller (admin) ---------- */
function sellerV(){
  if(!isAdmin())return '<div class="card">ఇది విక్రేతకు మాత్రమే.</div>';
  return '<h2>వస్తువు చేర్చండి</h2><label>వస్తువు పేరు</label><input id="pn"><label>విభాగం</label><select id="pc">'+CATS.map(function(c){return '<option value="'+c[0]+'">'+c[1]+'</option>'}).join("")+'</select><label>ధర (₹)</label><input id="pr" inputmode="decimal"><label>యూనిట్</label><input id="pu" value="కట్ట"><label>స్టాక్</label><input id="ps" inputmode="decimal"><label>ఫోటో</label><input id="pf" type="file" accept="image/*"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="po" style="width:auto;margin:0">ఆర్గానిక్ అని నిరూపించగలను</label><div class="err" id="er">'+esc(msg)+'</div><button class="b" style="width:100%" onclick="addP()">వస్తువు సేవ్ చేయి</button>'
  +'<h2>డెలివరీ PIN కోడ్లు</h2><input id="pz" value="'+esc(PINS)+'" placeholder="506313, 506314"><button class="b o" onclick="savePins()">PIN కోడ్లు సేవ్ చేయి</button><div class="mu">ఖాళీగా వదిలితే అన్ని PIN కోడ్లకు ఆర్డర్లు వస్తాయి.</div>'
  +'<h2>మీ వస్తువులు ('+P.length+')</h2>'+P.map(function(p){return '<div class="card row"><div><b>'+esc(p.name)+'</b><div class="mu">'+money(p.price)+' / '+esc(p.unit)+' · స్టాక్ '+p.stock+'</div></div><div><button class="b o" onclick="editP(\''+p.id+'\')">మార్చు</button> <button class="b o" onclick="delP(\''+p.id+'\')">తొలగించు</button></div></div>'}).join("");
}
function readImg(f){return new Promise(function(res){if(!f)return res(null);var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.75))};im.onerror=function(){res(null)};im.src=r.result};r.readAsDataURL(f)})}
async function addP(){
  var price=parseFloat(val("pr")),stock=parseFloat(val("ps"));
  if(!val("pn")||!val("pu"))return setMsg("వస్తువు పేరు, యూనిట్ నమోదు చేయండి.");
  if(!(price>0))return setMsg("ధర 0 కంటే ఎక్కువ ఉండాలి.");
  if(!(stock>=0))return setMsg("స్టాక్ సరైన సంఖ్య ఇవ్వండి.");
  var img=await readImg(document.getElementById("pf").files[0]);
  var r=await sb.from("products").insert({id:uid(),name:val("pn"),cat:val("pc"),price:price,unit:val("pu"),stock:stock,shop:SHOP,organic:document.getElementById("po").checked,img:img});
  if(r.error)return setMsg(r.error.message);
  msg="";await loadAll();render();
}
async function editP(id){var p=prod(id);var pr=prompt("కొత్త ధర (₹)",p.price);if(pr===null)return;var st=prompt("కొత్త స్టాక్",p.stock);if(st===null)return;
  pr=parseFloat(pr);st=parseFloat(st);if(!(pr>0)||!(st>=0))return alert("సరైన సంఖ్యలు ఇవ్వండి");
  var r=await sb.from("products").update({price:pr,stock:st,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)alert(r.error.message);await loadAll();render()}
async function delP(id){if(!confirm("ఈ వస్తువు తొలగించాలా?"))return;var r=await sb.from("products").delete().eq("id",id);if(r.error)alert(r.error.message);delete cart[id];saveCart();await loadAll();render()}
async function savePins(){var r=await sb.from("settings").upsert({key:"pins",value:val("pz")});if(r.error)return alert(r.error.message);await loadAll();alert("సేవ్ అయింది")}
init();
</script>
</body>
</html>
